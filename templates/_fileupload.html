{# 사용: {% from "_fileupload.html" import file_upload %}  {{ file_upload('필드명', rules) }} #}
{% macro file_upload(name, rules, label='파일을 여기로 드래그하거나 클릭하여 선택하세요') %}
<div class="fu" data-fileupload{% for k, v in rules.attrs().items() %} data-{{ k }}="{{ v }}"{% endfor %}>
  <div class="fu-drop border rounded text-center p-4" tabindex="0" role="button">
    <div class="fu-icon" aria-hidden="true">&#128193;</div>
    <div>{{ label }}</div>
    <small class="text-muted d-block mt-1">{{ rules.hint() }}</small>
    <input type="file" class="fu-input d-none" name="{{ name }}"
           {%- if rules.multiple %} multiple{% endif %}
           {%- if rules.allow %} accept="{% for e in rules.allow %}.{{ e }}{% if not loop.last %},{% endif %}{% endfor %}"{% endif %}>
  </div>
  <div class="fu-errors alert alert-danger mt-2 d-none" role="alert"></div>
  <ul class="fu-list list-group mt-2"></ul>
</div>
{% endmacro %}
