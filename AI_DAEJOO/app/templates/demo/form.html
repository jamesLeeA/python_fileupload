{% extends "base.html" %}
{% from "attach/_attach.html" import attach_field %}
{% block content %}
<h1 class="h4 mb-3">{{ '글 수정' if post_id else '새 글' }}</h1>
<form method="post" enctype="multipart/form-data">
  <div class="form-group">
    <label>제목</label>
    <input class="form-control" name="title" value="{{ post.title }}">
  </div>
  <div class="form-group">
    <label>내용</label>
    <textarea class="form-control" name="content" rows="3">{{ post.content }}</textarea>
  </div>
  <div class="form-group">
    <label>첨부 (드래그 앤 드롭형)</label>
    {{ attach_field(attach_drop) }}
  </div>
  <div class="form-group">
    <label>추가 첨부 (버튼형)</label>
    {{ attach_field(attach_btn) }}
  </div>
  <button class="btn btn-primary">저장</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('attach_demo.index') }}">목록</a>
</form>
{% endblock %}
